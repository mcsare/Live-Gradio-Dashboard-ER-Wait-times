name: model

on:
  schedule:
    # Hourly, a few minutes after a collector run. cron-job.org also triggers this,
    # because GitHub's own timer is unreliable; the job skips itself if it ran in the last 40 min.
    - cron: "12 * * * *"
  workflow_dispatch: {}

concurrency:
  group: model
  cancel-in-progress: false

jobs:
  retrain_and_predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-model.txt
      - run: python model/retrain_and_predict.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
