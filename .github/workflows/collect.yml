name: collect

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-collector.txt
      - run: python scripts/load_static.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python collector/run_loop.py --polls 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
